[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jp-writing-quality-skill"
version = "0.1.0"
requires-python = ">=3.10"
description = "Deterministic Japanese writing quality checks for Agent Skills"
readme = "README.md"
license = {text = "MIT"}

[project.scripts]
jp-writing-lint = "jp_writing_quality.cli:main"

[tool.setuptools.packages.find]
include = ["jp_writing_quality*"]

[tool.setuptools.package-data]
jp_writing_quality = ["rules/*.json"]
