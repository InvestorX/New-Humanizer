[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "new-humanizer"
version = "0.1.0"
requires-python = ">=3.10"
description = "New-Humanizer: deterministic Japanese writing quality checks for Agent Skills"
readme = "README.md"
license = {file = "LICENSE"}

[project.scripts]
new-humanizer = "new_humanizer.cli:main"

[tool.setuptools.packages.find]
include = ["new_humanizer*"]

[tool.setuptools.package-data]
new_humanizer = ["rules/*.json"]
